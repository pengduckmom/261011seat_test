
<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>우리 반 자리배치</title>
<style>
  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: #f3f5fa;
    color: #26334a;
    font-family: "Pretendard", "Malgun Gothic", sans-serif;
  }

  .container {
    max-width: 1100px;
    margin: 35px auto;
    padding: 0 20px;
  }

  h1 { margin-bottom: 8px; }
  .subtitle { color: #718096; margin-bottom: 25px; }

  .panel {
    background: white;
    border-radius: 16px;
    padding: 24px;
    margin-bottom: 20px;
    box-shadow: 0 3px 15px #26334a0c;
  }

  .controls {
    display: flex;
    gap: 12px;
    flex-wrap: wrap;
    align-items: center;
  }

  select, button {
    padding: 12px 16px;
    border-radius: 9px;
    font-size: 14px;
    font-family: inherit;
  }

  select {
    border: 1px solid #cbd5e1;
    background: white;
  }

  button {
    border: none;
    background: #e8edf5;
    color: #26334a;
    font-weight: 600;
    cursor: pointer;
  }

  button:hover { filter: brightness(0.95); }

  .primary {
    background: #4769dc;
    color: white;
  }

  .success {
    background: #16866d;
    color: white;
  }

  .danger {
    background: #fee2e2;
    color: #b91c1c;
  }

  .board {
    text-align: center;
    padding: 16px;
    border-radius: 10px;
    background: #334155;
    color: white;
    font-weight: bold;
    margin-bottom: 30px;
  }

  .classroom {
    display: flex;
    justify-content: center;
    align-items: flex-start;
    gap: 22px;
    overflow-x: auto;
    padding: 15px 0 30px;
  }

  .group {
    display: grid;
    grid-template-rows: repeat(4, 65px);
    gap: 12px;
  }

  .desk-row {
    display: flex;
    gap: 6px;
  }

  .seat {
    width: 66px;
    height: 65px;
    display: flex;
    align-items: center;
    justify-content: center;
    border: 2px solid #c9d6f5;
    border-radius: 10px;
    background: #edf2ff;
    color: #28449b;
    font-size: 19px;
    font-weight: bold;
    cursor: pointer;
    transition: 0.15s;
    flex-shrink: 0;
  }

  .seat:hover {
    background: #dbe7ff;
    transform: translateY(-2px);
  }

  .seat.selected {
    background: #fef08a;
    border-color: #eab308;
    color: #854d0e;
  }

  .seat.empty {
    color: #94a3b8;
    background: #f8fafc;
    border-style: dashed;
  }

  .hint {
    text-align: center;
    font-size: 13px;
    color: #64748b;
  }

  .history-item {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 10px;
    padding: 13px 0;
    border-bottom: 1px solid #e2e8f0;
  }

  .history-info {
    display: flex;
    flex-direction: column;
    gap: 5px;
  }

  .history-info small { color: #64748b; }

  .history-actions {
    display: flex;
    gap: 6px;
  }

  .history-actions button { padding: 8px 10px; }

  @media (max-width: 650px) {
    .container { padding: 0 10px; }
    .panel { padding: 15px; }
    .classroom { gap: 12px; justify-content: flex-start; }
    .seat { width: 48px; height: 55px; font-size: 15px; }
    .group { grid-template-rows: repeat(4, 55px); }
    .history-item { align-items: flex-start; }
  }
</style>
</head>

<body>
<div class="container">

  <h1>🏫 우리 반 자리배치</h1>
  <p class="subtitle">
    총 20명 · 1~21번 중 19번 제외 · 랜덤 자리배치
  </p>

  <section class="panel">
    <h3>자리배치 설정</h3>
    <div class="controls">
      <select id="layout" onchange="changeLayout()">
        <option value="221">① 2명 - 2명 - 1명</option>
        <option value="212">② 2명 - 1명 - 2명</option>
        <option value="11111">③ 1명씩 5줄</option>
      </select>

      <button class="primary" onclick="randomAssign()">
        🎲 랜덤 자리배치
      </button>

      <button class="success" onclick="saveArrangement()">
        💾 결과 저장
      </button>

      <button onclick="resetSeats()">
        ↺ 자리 초기화
      </button>
    </div>
  </section>

  <section class="panel">
    <div class="board">칠판 / 교탁</div>
    <div id="classroom" class="classroom"></div>
    <p class="hint">
      학생 번호 두 개를 차례대로 클릭하면 서로 자리가 바뀝니다.
    </p>
    <p id="status" class="hint" aria-live="polite"></p>
  </section>

  <section class="panel">
    <h3>📚 누적 자리배치 기록</h3>
    <div class="controls">
      <button onclick="exportCSV()">CSV 내보내기</button>
      <button class="danger" onclick="clearHistory()">
        전체 기록 삭제
      </button>
    </div>
    <div id="history"></div>
  </section>

</div>

<script>
  // 학생 번호: 19번 제외
  const students = Array.from(
    { length: 21 },
    (_, i) => i + 1
  ).filter(n => n !== 19);

  const STORAGE_KEY = "classSeatingHistory_v1";

  // 자리배치 유형
  const layouts = {
    "221": [2, 2, 1],
    "212": [2, 1, 2],
    "11111": [1, 1, 1, 1, 1]
  };

  const layoutNames = {
    "221": "2명-2명-1명",
    "212": "2명-1명-2명",
    "11111": "1명씩 5줄"
  };

  let currentLayout = "221";
  let seats = Array(20).fill(null);
  let selectedSeat = null;

  function getHistory() {
    try {
      const data = JSON.parse(
        localStorage.getItem(STORAGE_KEY) || "[]"
      );
      return Array.isArray(data) ? data : [];
    } catch {
      return [];
    }
  }

  function setHistory(data) {
    localStorage.setItem(
      STORAGE_KEY,
      JSON.stringify(data)
    );
  }

  function setStatus(message) {
    document.getElementById("status").textContent = message;
  }

  // 실제 교실 형태로 책상 렌더링
  function renderSeats() {
    const classroom = document.getElementById("classroom");
    classroom.innerHTML = "";

    const columns = layouts[currentLayout];
    let index = 0;

    columns.forEach((count) => {
      const group = document.createElement("div");
      group.className = "group";

      for (let row = 0; row < 4; row++) {
        const deskRow = document.createElement("div");
        deskRow.className = "desk-row";

        for (let col = 0; col < count; col++) {
          const seatIndex = index++;
          const seat = document.createElement("div");

          seat.className = "seat";
          seat.textContent = seats[seatIndex] ?? "—";

          if (seats[seatIndex] === null) {
            seat.classList.add("empty");
          }

          if (selectedSeat === seatIndex) {
            seat.classList.add("selected");
          }

          seat.onclick = () => selectSeat(seatIndex);
          deskRow.appendChild(seat);
        }

        group.appendChild(deskRow);
      }

      classroom.appendChild(group);
    });
  }

  function changeLayout() {
    currentLayout = document.getElementById("layout").value;
    selectedSeat = null;

    // 기존 학생 배치는 유지하고 책상 구조만 변경
    renderSeats();
    setStatus("자리배치 유형을 변경했습니다.");
  }

  // Fisher-Yates 무작위 섞기
  function shuffle(array) {
    const result = [...array];

    for (let i = result.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [result[i], result[j]] = [result[j], result[i]];
    }

    return result;
  }

  function randomAssign() {
    if (
      seats.some(n => n !== null) &&
      !confirm("현재 자리배치를 새로 추첨할까요?")
    ) {
      return;
    }

    seats = shuffle(students);
    selectedSeat = null;
    renderSeats();

    setStatus("20명의 학생을 무작위로 배치했습니다.");
  }

  // 두 자리 클릭 시 학생 교환
  function selectSeat(index) {
    if (selectedSeat === null) {
      selectedSeat = index;
      setStatus("교환할 두 번째 자리를 선택하세요.");
    } else if (selectedSeat === index) {
      selectedSeat = null;
      setStatus("선택을 취소했습니다.");
    } else {
      [seats[selectedSeat], seats[index]] =
        [seats[index], seats[selectedSeat]];

      selectedSeat = null;
      setStatus("두 학생의 자리를 교환했습니다.");
    }

    renderSeats();
  }

  function resetSeats() {
    if (!confirm("현재 자리배치를 초기화할까요?")) {
      return;
    }

    seats = Array(20).fill(null);
    selectedSeat = null;
    renderSeats();
    setStatus("자리를 초기화했습니다.");
  }

  function isValidArrangement(arr) {
    return (
      Array.isArray(arr) &&
      arr.length === students.length &&
      new Set(arr).size === students.length &&
      students.every(n => arr.includes(n))
    );
  }

  // 자리배치 기록 누적 저장
  function saveArrangement() {
    if (!isValidArrangement(seats)) {
      alert("20명의 학생이 모두 배치된 후 저장할 수 있습니다.");
      return;
    }

    const history = getHistory();

    history.unshift({
      id: Date.now() + "_" + Math.random().toString(36).slice(2),
      date: new Date().toLocaleString("ko-KR"),
      layout: currentLayout,
      seats: [...seats]
    });

    try {
      setHistory(history);
      renderHistory();
      setStatus("자리배치 결과를 저장했습니다.");
      alert("자리배치 결과가 저장되었습니다.");
    } catch {
      alert("저장 공간에 문제가 발생했습니다. CSV로 백업해 주세요.");
    }
  }

  function renderHistory() {
    const history = getHistory();
    const container = document.getElementById("history");
    container.innerHTML = "";

    if (history.length === 0) {
      container.textContent = "아직 저장된 기록이 없습니다.";
      return;
    }

    history.forEach((record, index) => {
      const item = document.createElement("div");
      item.className = "history-item";

      const info = document.createElement("div");
      info.className = "history-info";

      const title = document.createElement("strong");
      title.textContent = `${history.length - index}회차 · ${record.date}`;

      const detail = document.createElement("small");
      detail.textContent =
        `배치 유형: ${layoutNames[record.layout] || record.layout}`;

      info.append(title, detail);

      const actions = document.createElement("div");
      actions.className = "history-actions";

      const loadButton = document.createElement("button");
      loadButton.textContent = "불러오기";
      loadButton.onclick = () => loadArrangement(record.id);

      const deleteButton = document.createElement("button");
      deleteButton.textContent = "삭제";
      deleteButton.className = "danger";
      deleteButton.onclick = () => deleteRecord(record.id);

      actions.append(loadButton, deleteButton);
      item.append(info, actions);
      container.appendChild(item);
    });
  }

  function loadArrangement(id) {
    const record = getHistory().find(r => r.id === id);

    if (!record || !isValidArrangement(record.seats)) {
      alert("불러올 수 없는 기록입니다.");
      return;
    }

    if (!layouts[record.layout]) {
      alert("지원하지 않는 배치 유형입니다.");
      return;
    }

    currentLayout = record.layout;
    seats = [...record.seats];
    selectedSeat = null;

    document.getElementById("layout").value = currentLayout;
    renderSeats();
    setStatus("이전 자리배치 기록을 불러왔습니다.");
  }

  function deleteRecord(id) {
    if (!confirm("이 기록을 삭제할까요?")) return;

    const history = getHistory().filter(r => r.id !== id);
    setHistory(history);
    renderHistory();
  }

  function clearHistory() {
    if (!confirm("모든 자리배치 기록을 삭제할까요?")) return;

    localStorage.removeItem(STORAGE_KEY);
    renderHistory();
    setStatus("모든 저장 기록을 삭제했습니다.");
  }

  // 저장된 자리의 실제 위치 계산
  function getSeatPositions(layout) {
    const positions = [];
    let index = 0;

    layouts[layout].forEach((count, groupIndex) => {
      for (let row = 0; row < 4; row++) {
        for (let col = 0; col < count; col++) {
          positions.push({
            index: index++,
            group: groupIndex + 1,
            row: row + 1,
            column: col + 1
          });
        }
      }
    });

    return positions;
  }

  function csvEscape(value) {
    const text = String(value ?? "");
    return '"' + text.replace(/"/g, '""') + '"';
  }

  function exportCSV() {
    const history = getHistory();

    if (history.length === 0) {
      alert("내보낼 기록이 없습니다.");
      return;
    }

    const rows = [
      ["회차", "저장일시", "배치유형",
       "책상줄", "앞에서몇번째", "줄내좌석", "학생번호"]
    ];

    [...history].reverse().forEach((record, i) => {
      if (!layouts[record.layout]) return;

      const positions = getSeatPositions(record.layout);

      positions.forEach(pos => {
        rows.push([
          i + 1,
          record.date,
          layoutNames[record.layout],
          pos.group,
          pos.row,
          pos.column,
          record.seats[pos.index]
        ]);
      });
    });

    const csv = "\uFEFF" + rows
      .map(row => row.map(csvEscape).join(","))
      .join("\r\n");

    const blob = new Blob([csv], {
      type: "text/csv;charset=utf-8;"
    });

    const url = URL.createObjectURL(blob);
    const link = document.createElement("a");

    link.href = url;
    link.download = "학급_자리배치_누적기록.csv";
    document.body.appendChild(link);
    link.click();
    link.remove();

    URL.revokeObjectURL(url);
  }

  // 앱 최초 실행
  document.getElementById("layout").value = currentLayout;
  renderSeats();
  renderHistory();
</script>
</body>
</html>
